name: Ascii Box SDK 0.0.35 compatibility fix

on:
  push:
    branches:
      - ascii-box-sdk35-fix

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Patch direct Box response compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          backend_path = Path('providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py')
          text = backend_path.read_text()
          old = '''            box_id = created.box.id\n'''
          new = '''            created_box = getattr(created, "box", created)\n            box_id = created_box.id\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''            box = self._get_api().get(sandbox, _request_timeout=self._http_timeout(_FILE_OP_TIMEOUT)).box\n'''
          new = '''            response = self._get_api().get(\n                sandbox, _request_timeout=self._http_timeout(_FILE_OP_TIMEOUT)\n            )\n            box = getattr(response, "box", response)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          backend_path.write_text(text)

          test_path = Path('providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py')
          tests = test_path.read_text()
          marker = '    def test_spec_and_sizing_are_passed_at_creation(self, wait_ready):\n'
          start = tests.index(marker)
          pos = tests.index('        api.create.return_value = SimpleNamespace(box=SimpleNamespace(id="bx_created1"))\n', start)
          direct = '        api.create.return_value = SimpleNamespace(id="bx_created1")\n'
          tests = tests[:pos] + direct + tests[pos + len('        api.create.return_value = SimpleNamespace(box=SimpleNamespace(id="bx_created1"))\n'):]

          confirm_marker = 'class TestRunCommand:\n'
          insert_at = tests.index(confirm_marker)
          regression = '''    @mock.patch("ascii_box_sdk.wait_until_ready", autospec=True)\n    def test_wrapped_create_response_remains_supported(self, _wait_ready):\n        backend, api = _backend_with_api()\n        api.create.return_value = SimpleNamespace(box=SimpleNamespace(id="bx_wrapped1"))\n\n        assert backend.create(spec=SandboxSpec(block_network=False)) == "bx_wrapped1"\n\n    def test_confirm_exists_accepts_direct_box_response(self):\n        backend, api = _backend_with_api()\n        api.get.return_value = SimpleNamespace(id="bx_direct1", state="running")\n\n        backend._confirm_sandbox_exists("bx_direct1")\n\n\n'''
          tests = tests[:insert_at] + regression + tests[insert_at:]
          test_path.write_text(tests)
          PY
      - name: Format and lint touched Python
        run: |
          uv run ruff format providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py
          uv run ruff check providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py
      - name: Run focused tests with Ascii extra
        run: uv run --project providers/common/ai --extra sandbox-ascii-box pytest providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py -q
      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ascii-box-sdk35-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py .github/workflows/ascii-box-sdk35-fix.yml
          git commit -m "[skip ci] Support direct Box responses from ascii-box-sdk"
          git push origin HEAD:ascii-box-sdk35-fix
