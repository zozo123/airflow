name: Apply Ascii Box SDK 0.0.35 compatibility fix

on:
  push:
    branches:
      - ascii-box-sdk35-fix-fast

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py
            providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py
            .github/workflows/ascii-box-sdk35-fast.yml
          sparse-checkout-cone-mode: false
      - name: Apply compatibility fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          backend_path = Path('providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py')
          text = backend_path.read_text()
          old = '            box_id = created.box.id\n'
          new = '            created_box = getattr(created, "box", created)\n            box_id = created_box.id\n'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '            box = self._get_api().get(sandbox, _request_timeout=self._http_timeout(_FILE_OP_TIMEOUT)).box\n'
          new = '''            response = self._get_api().get(\n                sandbox, _request_timeout=self._http_timeout(_FILE_OP_TIMEOUT)\n            )\n            box = getattr(response, "box", response)\n'''
          assert text.count(old) == 1
          backend_path.write_text(text)

          test_path = Path('providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py')
          tests = test_path.read_text()
          marker = '    def test_spec_and_sizing_are_passed_at_creation(self, wait_ready):\n'
          start = tests.index(marker)
          wrapped = '        api.create.return_value = SimpleNamespace(box=SimpleNamespace(id="bx_created1"))\n'
          pos = tests.index(wrapped, start)
          tests = tests[:pos] + '        api.create.return_value = SimpleNamespace(id="bx_created1")\n' + tests[pos + len(wrapped):]

          insert_at = tests.index('class TestRunCommand:\n')
          regression = '''    @mock.patch("ascii_box_sdk.wait_until_ready", autospec=True)\n    def test_wrapped_create_response_remains_supported(self, _wait_ready):\n        backend, api = _backend_with_api()\n        api.create.return_value = SimpleNamespace(box=SimpleNamespace(id="bx_wrapped1"))\n\n        assert backend.create(spec=SandboxSpec(block_network=False)) == "bx_wrapped1"\n\n    def test_confirm_exists_accepts_direct_box_response(self):\n        backend, api = _backend_with_api()\n        api.get.return_value = SimpleNamespace(id="bx_direct1", state="running")\n\n        backend._confirm_sandbox_exists("bx_direct1")\n\n\n'''
          tests = tests[:insert_at] + regression + tests[insert_at:]
          test_path.write_text(tests)
          PY
      - name: Commit code-only delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ascii-box-sdk35-fast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py .github/workflows/ascii-box-sdk35-fast.yml
          git commit -m "[skip ci] Support direct Box responses from ascii-box-sdk"
          git push origin HEAD:ascii-box-sdk35-fix-fast
