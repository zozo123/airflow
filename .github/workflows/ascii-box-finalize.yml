name: TEMP finalize Ascii Box provider

on:
  push:
    branches:
      - add-ascii-box-sandbox-backend
    paths:
      - .github/workflows/ascii-box-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: add-ascii-box-sandbox-backend
          fetch-depth: 1

      - name: Apply final provider integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path("providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py")
          text = backend.read_text()
          marker = "_MACHINE_TYPES = frozenset({\"small\", \"default\", \"large\"})\n\n\n"
          helper = '''_MACHINE_TYPES = frozenset({"small", "default", "large"})\n\n\ndef _box_from_response(response: Any) -> Any:\n    """Return the Box model from SDK versions that return it directly or wrapped."""\n    return getattr(response, "box", response)\n\n\n'''
          if "def _box_from_response" not in text:
              assert marker in text
              text = text.replace(marker, helper, 1)
          assert "box_id = created.box.id" in text
          text = text.replace("box_id = created.box.id", "box_id = _box_from_response(created).id", 1)
          old = 'box = self._get_api().get(sandbox, _request_timeout=self._http_timeout(_FILE_OP_TIMEOUT)).box'
          new = 'box = _box_from_response(\n            self._get_api().get(sandbox, _request_timeout=self._http_timeout(_FILE_OP_TIMEOUT))\n        )'
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              "    implementation, because the native read API takes no size parameter and\n"
              "    would land a whole file in worker memory before ``max_bytes`` could reject\n"
              "    it. Written paths must resolve under ``/home/user`` or ``/tmp``.\n",
              "    implementation, because the native read API takes no size parameter and\n"
              "    would land a whole file in worker memory before ``max_bytes`` could reject\n"
              "    it.\n",
              1,
          )
          backend.write_text(text)

          provider = Path("providers/common/ai/provider.yaml")
          text = provider.read_text()
          docker = (
              "  - integration-name: Docker Sandboxes\n"
              "    external-doc-url: https://docs.docker.com/ai/sandboxes/\n"
              "    tags: [software]\n"
          )
          ascii_box = (
              "  - integration-name: Ascii Box\n"
              "    external-doc-url: https://docs.ascii.dev/box/quickstart\n"
              "    tags: [service]\n"
          )
          if "integration-name: Ascii Box" not in text:
              assert docker in text
              text = text.replace(docker, docker + ascii_box, 1)
          provider.write_text(text)

          docs = Path("providers/common/ai/docs/toolsets.rst")
          text = docs.read_text()
          old_warning = '''   Treat it as the backend you develop and test a sandboxed agent against, then\n   run something else in production. A hosted backend plugs in through\n   :class:`~airflow.providers.common.ai.sandbox.SandboxBackend`, but none ships\n   with the provider yet.\n'''
          new_warning = '''   Treat it as the backend you develop and test a sandboxed agent against, then\n   run something else in production -- either\n   :class:`~airflow.providers.common.ai.sandbox.AsciiBoxSandboxBackend` below,\n   or your own hosted backend behind\n   :class:`~airflow.providers.common.ai.sandbox.SandboxBackend`.\n'''
          if old_warning in text:
              text = text.replace(old_warning, new_warning, 1)

          section = '''Ascii Box backend\n^^^^^^^^^^^^^^^^^\n\n:class:`~airflow.providers.common.ai.sandbox.AsciiBoxSandboxBackend` runs each\nsandbox in an `Ascii Box <https://docs.ascii.dev/box/quickstart>`__, a hosted\ncloud-computer API. The Airflow worker needs only network access and an API key;\nit needs no local daemon, Docker socket, KVM, or nested virtualization.\n\nInstall the optional SDK with the ``sandbox-ascii-box`` extra::\n\n    pip install "apache-airflow-providers-common-ai[sandbox-ascii-box]"\n\n.. code-block:: python\n\n    from airflow.providers.common.ai.sandbox import AsciiBoxSandboxBackend, SandboxSpec\n    from airflow.providers.common.ai.toolsets import SandboxToolset\n\n    SandboxToolset(\n        AsciiBoxSandboxBackend(box_conn_id="ascii_box_default"),\n        spec=SandboxSpec(block_network=False),\n    )\n\nBy default, credentials resolve lazily from a generic Airflow connection on\nfirst use, so the API key can remain in the configured secrets backend:\n\n- ``password``: Box API key. Required.\n- ``host``: API base URL. Optional; defaults to ``https://ascii.dev/api/box/v1``.\n- Extra ``timeout``: HTTP request timeout in seconds.\n- Extra ``no_env``: whether Box should withhold account-stored secrets. Defaults\n  to ``true``.\n\nConstructor parameters:\n\n- ``box_conn_id``: Connection ID. Default ``"ascii_box_default"``. Passing\n  ``None`` reads ``BOX_API_KEY`` and optional ``BOX_BASE_URL`` from the worker\n  environment instead.\n- ``machine_type``: ``"small"``, ``"default"``, or ``"large"``.\n- ``ttl_seconds``: server-side auto-stop TTL. Default ``3600`` seconds.\n- ``ready_timeout``: provisioning deadline. Default ``300`` seconds.\n- ``no_env``: explicit override for the connection's ``no_env`` setting.\n\n``SandboxSpec.env`` is passed when the Box is created. Box cannot enforce a\ndeny-all network policy or a per-domain egress allowlist, so the backend refuses\n``block_network=True`` and ``allow_egress_to`` rather than silently weakening\nthe requested isolation. Use ``SandboxSpec(block_network=False)`` only when open\negress is acceptable.\n\nWrites use Box's native file API. Reads deliberately use the inherited bounded\nshell implementation so ``max_bytes`` is enforced inside the guest before file\ncontents reach worker memory. Command timeouts are capped at 600 seconds; a Box\nwhose command times out, or that never becomes ready, is torn down immediately,\nwith the server-side TTL as the orphan-cleanup backstop.\n\n'''
          anchor = "Bringing your own backend\n^^^^^^^^^^^^^^^^^^^^^^^^^\n"
          if "Ascii Box backend\n^^^^^^^^^^^^^^^^^" not in text:
              assert anchor in text
              text = text.replace(anchor, section + anchor, 1)
          docs.write_text(text)
          PY

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Regenerate Common AI provider metadata and docs
        env:
          DISTRIBUTIONS_LIST: common.ai
        run: uv run --project dev/breeze breeze release-management prepare-provider-documentation --reapply-templates-only

      - name: Run focused Ascii Box unit tests with SDK installed
        run: uv run --project providers/common/ai --extra sandbox-ascii-box pytest providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py -q

      - name: Verify and commit final files
        shell: bash
        run: |
          git rm .github/workflows/ascii-box-finalize.yml
          git add \
            providers/common/ai/provider.yaml \
            providers/common/ai/docs/index.rst \
            providers/common/ai/docs/toolsets.rst \
            providers/common/ai/src/airflow/providers/common/ai/get_provider_info.py \
            providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Ascii Box provider integration"
          git push origin HEAD:add-ascii-box-sandbox-backend
