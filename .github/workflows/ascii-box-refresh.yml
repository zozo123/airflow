name: Temporary Ascii Box refresh

on:
  push:
    branches:
      - add-ascii-box-sandbox-backend

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip ascii-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate lock
        run: uv lock
      - name: Commit generated lock
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh uv.lock for Ascii Box [skip ascii-refresh]"
          git push origin HEAD:add-ascii-box-sandbox-backend
