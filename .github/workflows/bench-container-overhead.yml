---
name: "Bench container overhead"
on:  # yamllint disable-line rule:truthy
  push:
    branches: [bench/container-overhead]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "docker load vs data-directory snapshot"
        run: bash .github/bench/round4_snapshot.sh
  db:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mysql, sqlite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Make /mnt writeable and move docker there"
        run: ./scripts/ci/make_mnt_writeable.sh && ./scripts/ci/move_docker_to_mnt.sh
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
      - name: "Pull the CI image"
        run: docker pull -q ghcr.io/apache/airflow/main/ci/python3.10:latest
      - name: "Stock vs tuned ${{ matrix.backend }}"
        run: bash .github/bench/round4_db.sh ${{ matrix.backend }}
