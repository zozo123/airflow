---
name: Helm tests
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runners:
        description: "The array of labels (in json form) determining runners."
        required: true
        type: string
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        required: true
        type: string
      helm-test-packages:
        description: "Stringified JSON array of helm test packages to test"
        required: true
        type: string
      helm-test-kubernetes-versions:
        description: "Stringified JSON array of Kubernetes versions to validate against"
        required: true
        type: string
      default-python-version:
        description: "Which version of python should be used by default"
        required: true
        type: string
      use-uv:
        description: "Whether to use uvloop (true/false)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare-helm-matrix:
    name: "Prepare Helm test matrix"
    runs-on: ["ubuntu-slim"]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_work: ${{ steps.matrix.outputs.has_work }}
    steps:
      - name: "Build duration-balanced Helm test buckets"
        id: matrix
        env:
          HELM_TEST_PACKAGES: ${{ inputs.helm-test-packages }}
          HELM_TEST_KUBERNETES_VERSIONS: ${{ inputs.helm-test-kubernetes-versions }}
        shell: python3 {0}
        run: |
          import json
          import os

          packages = json.loads(os.environ["HELM_TEST_PACKAGES"])
          kubernetes_versions = json.loads(os.environ["HELM_TEST_KUBERNETES_VERSIONS"])

          # Relative timings from recent scheduled CI runs. They are only used to keep the
          # buckets balanced; correctness never depends on the exact values. Unknown packages
          # are treated as heavy so that a new test group is distributed conservatively.
          weights = {
              "airflow_aux": 367,
              "airflow_core": 419,
              "apiserver": 54,
              "dagprocessor": 38,
              "other": 214,
              "otel_collector": 75,
              "redis": 46,
              "security": 140,
              "statsd": 46,
          }
          unknown_weight = max(weights.values())
          bucket_count = min(3, len(packages))
          buckets = [
              {"index": index, "weight": 0, "packages": []}
              for index in range(bucket_count)
          ]

          for package in sorted(
              packages,
              key=lambda package: (-weights.get(package, unknown_weight), package),
          ):
              bucket = min(buckets, key=lambda item: (item["weight"], item["index"]))
              bucket["packages"].append(package)
              bucket["weight"] += weights.get(package, unknown_weight)

          include = []
          for kubernetes_version in kubernetes_versions:
              for bucket in buckets:
                  if not bucket["packages"]:
                      continue
                  include.append(
                      {
                          "kubernetes-version": kubernetes_version,
                          "helm-test-packages": bucket["packages"],
                          "bucket-label": ", ".join(bucket["packages"]),
                      }
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}\n")
              output.write(f"has_work={'true' if include else 'false'}\n")

  tests-helm:
    needs: [prepare-helm-matrix]
    if: needs.prepare-helm-matrix.outputs.has_work == 'true'
    timeout-minutes: 80
    name: >-
      Unit tests Helm: ${{ matrix.bucket-label }}
      (K8S ${{ matrix.kubernetes-version }})
    runs-on: ${{ fromJSON(inputs.runners) }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare-helm-matrix.outputs.matrix) }}
    env:
      # Always use default Python version of CI image for preparing packages
      PYTHON_MAJOR_MINOR_VERSION: "${{ inputs.default-python-version }}"
      PARALLEL_TEST_TYPES: "Helm"
      BACKEND: "none"
      DB_RESET: "false"
      JOB_ID: "helm-tests"
      USE_XDIST: "true"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Prepare breeze & CI image: ${{ inputs.default-python-version }}"
        uses: ./.github/actions/prepare_breeze_and_image
        with:
          platform: ${{ inputs.platform }}
          python: "${{ inputs.default-python-version }}"
          use-uv: ${{ inputs.use-uv }}
          make-mnt-writeable-and-cleanup: true
      - name: "Helm Unit Tests: ${{ matrix.bucket-label }} (K8S ${{ matrix.kubernetes-version }})"
        env:
          HELM_TEST_PACKAGES: ${{ toJSON(matrix.helm-test-packages) }}
          HELM_TEST_KUBERNETES_VERSION: "${{ matrix.kubernetes-version }}"
        shell: bash
        run: |
          mapfile -t packages < <(jq -r '.[]' <<< "${HELM_TEST_PACKAGES}")
          failed=()

          for package in "${packages[@]}"; do
            echo "::group::Helm Unit Tests: ${package} (K8S ${HELM_TEST_KUBERNETES_VERSION})"
            if breeze testing helm-tests \
                --test-type "${package}" \
                --kubernetes-version "${HELM_TEST_KUBERNETES_VERSION}"; then
              exit_code=0
            else
              exit_code=$?
            fi
            echo "::endgroup::"

            if (( exit_code != 0 )); then
              failed+=("${package} (${exit_code})")
            fi
          done

          if (( ${#failed[@]} != 0 )); then
            printf 'Failed Helm test groups: %s\n' "${failed[*]}"
            exit 1
          fi

  tests-helm-release:
    timeout-minutes: 80
    name: "Release Helm"
    runs-on: ${{ fromJSON(inputs.runners) }}
    env:
      PYTHON_MAJOR_MINOR_VERSION: "${{inputs.default-python-version}}"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
      - name: Setup git for tagging
        run: |
          git config --global user.email "bot@airflow.apache.org"
          git config --global user.name "Your friendly bot"
      - name: "Remove old artifacts"
        run: rm -rf dist/*
      - name: "Setup k8s/helm environment"
        run: breeze k8s setup-env
      - name: "Install helm gpg plugin"
        run: >
          breeze k8s shell -c "helm plugin install https://github.com/technosophos/helm-gpg
          --version 6303407eb63deaeb1b2f24de611e3468a27ec05b" || true
      - name: "Helm release tarball"
        run: >
          breeze release-management prepare-helm-chart-tarball --ignore-version-check --override-tag
          --skip-tag-signing --version-suffix dev0
      - name: Generate GPG key for signing
        # Sometimes the key will be already added to the keyring, so we ignore the error
        run: gpg --batch --passphrase '' --quick-gen-key dev@airflow.apache.org default default || true
      - name: "Helm release package"
        run: >
          breeze release-management prepare-helm-chart-package --sign-email dev@airflow.apache.org
      - name: "Verify packaged chart contents and lint"
        run: >
          uv run scripts/ci/verify_helm_chart_package.py dist/airflow-*.tgz
      - name: "Sign artifacts for ASF distribution"
        run: ./dev/sign.sh dist/airflow-*.tgz dist/airflow-*-source.tar.gz
        env:
          SIGN_WITH: dev@airflow.apache.org
      - name: "Fetch Git Tags"
        run: git fetch --tags
      - name: "Test helm chart issue generation"
        run: >
          breeze release-management generate-issue-content-helm-chart --limit-pr-count 2
          --previous-release helm-chart/1.15.0 --current-release helm-chart/1.16.0 --verbose
      - name: "Upload Helm artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Helm artifacts
          path: ./dist/airflow-*
          retention-days: 7
          if-no-files-found: error
