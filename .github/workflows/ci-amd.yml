name: Tests (AMD) controlled ROI
permissions:
  contents: read
env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_USERNAME: ${{ github.actor }}
  JAVA_VERSION: '11'
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  VERBOSE: 'true'
concurrency:
  group: roi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-info:
    name: Build info
    runs-on:
    - ubuntu-22.04
    outputs:
      all-python-versions-list-as-string: '3.10'
      arm-runners: '["ubuntu-22.04-arm"]'
      basic-checks-only: 'false'
      canary-run: 'false'
      ci-image-build: 'true'
      core-test-types-list-as-strings-in-json: '[{"description": "API...CLI", "test_types": "API Always CLI"}, {"description": "Core...Serialization", "test_types":
        "Core Other Serialization"}]'
      debug-resources: 'false'
      default-branch: main
      default-constraints-branch: constraints-main
      default-helm-version: v3.19.0
      default-kind-version: v0.33.0
      default-kubernetes-version: v1.31.12
      default-mysql-version: '8.0'
      default-postgres-version: '14'
      default-python-version: '3.10'
      disable-airflow-repo-cache: 'false'
      docker-cache: registry
      docs-build: 'true'
      docs-list-as-string: ''
      excluded-providers-as-string: '{"3.14": ["apache.cassandra"]}'
      force-pip: 'false'
      full-tests-needed: 'true'
      has-migrations: 'false'
      helm-test-packages: '["airflow_aux", "airflow_core", "apiserver", "dagprocessor", "otel_collector", "other", "redis", "security", "statsd"]'
      helm-test-kubernetes-versions: '["1.31.12"]'
      include-success-outputs: 'false'
      individual-providers-test-types-list-as-strings-in-json: '[{"description": "airbyte...apache.tinker", "test_types": "Providers[airbyte] Providers[akeyless]
        Providers[alibaba] Providers[amazon]  Providers[anthropic] Providers[apache.arrow] Providers[apache.beam] Providers[apache.cassandra] Providers[apache.drill]
        Providers[apache.druid] Providers[apache.flink] Providers[apache.hdfs]  Providers[apache.hive] Providers[apache.iceberg] Providers[apache.impala] Providers[apache.kafka]
        Providers[apache.kylin] Providers[apache.livy] Providers[apache.pig] Providers[apache.pinot]  Providers[apache.spark] Providers[apache.tinkerpop]"}, {"description":
        "apprise...duckdb", "test_types": "Providers[apprise] Providers[arangodb] Providers[asana] Providers[atlassian.jira]  Providers[celery] Providers[clickhousedb]
        Providers[cloudant] Providers[cncf.kubernetes] Providers[cohere] Providers[common.ai] Providers[common.compat] Providers[common.dataquality]  Providers[common.io]
        Providers[common.messaging] Providers[common.sql] Providers[databricks] Providers[datadog] Providers[dbt.cloud] Providers[dingding] Providers[discord] Providers[docker]  Providers[duckdb]"},
        {"description": "edge3...microsoft.mss", "test_types": "Providers[edge3] Providers[elasticsearch] Providers[exasol] Providers[fab] Providers[facebook] Providers[ftp]
        Providers[git]  Providers[github] Providers[google] Providers[grpc] Providers[hashicorp] Providers[http] Providers[ibm.db2] Providers[ibm.mq] Providers[imap]
        Providers[influxdb] Providers[informatica] Providers[jdbc]  Providers[jenkins] Providers[keycloak] Providers[microsoft.azure] Providers[microsoft.mssql]"},
        {"description": "microsoft.psr...salesforce", "test_types": "Providers[microsoft.psrp]  Providers[microsoft.winrm] Providers[modal] Providers[mongo] Providers[mysql]
        Providers[neo4j] Providers[odbc] Providers[openai] Providers[openfaas] Providers[openlineage] Providers[opensearch]  Providers[opsgenie] Providers[oracle]
        Providers[pagerduty] Providers[papermill] Providers[pgvector] Providers[pinecone] Providers[postgres] Providers[presto] Providers[qdrant] Providers[redis]  Providers[salesforce]"},
        {"description": "samba...zendesk", "test_types": "Providers[samba] Providers[segment] Providers[sendgrid] Providers[sftp] Providers[singularity] Providers[slack]
        Providers[smtp] Providers[snowflake] Providers[sqlite] Providers[ssh] Providers[standard] Providers[tableau] Providers[telegram] Providers[teradata] Providers[trino]
        Providers[vertica] Providers[vespa]  Providers[weaviate] Providers[yandex] Providers[ydb] Providers[zendesk]"}]'
      java-sdk-version: '17'
      kubernetes-combos: '[''3.10-v1.31.12'']'
      kubernetes-combos-list-as-string: 3.10-v1.31.12
      kubernetes-versions-list-as-string: v1.31.12
      kustomize-overlay-names: '["kerberos"]'
      run-kustomize-overlays-tests: 'true'
      latest-versions-only: 'false'
      mysql-exclude: '[]'
      mysql-versions: '[''8.0'']'
      platform: linux/amd64
      postgres-exclude: '[]'
      postgres-versions: '[''14'']'
      prod-image-build: 'true'
      providers-compatibility-tests-matrix: '[{"python-version": "3.10", "airflow-version": "2.11.1", "remove-providers": "anthropic common.messaging common.dataquality
        edge3 fab git keycloak informatica  modal opensearch", "run-unit-tests": "true"}, {"python-version": "3.10", "airflow-version": "3.0.6", "remove-providers":
        "", "run-unit-tests": "true"}, {"python-version": "3.10", "airflow-version":  "3.1.8", "remove-providers": "", "run-unit-tests": "true"}, {"python-version":
        "3.10", "airflow-version": "3.2.2", "remove-providers": "", "run-unit-tests": "true"}, {"python-version": "3.10",  "airflow-version": "3.3.2", "remove-providers":
        "", "run-unit-tests": "true"}]'
      providers-test-types-list-as-strings-in-json: '[{"description": "-amazon,celer...standard", "test_types": "Providers[-amazon,celery,google,standard] Providers[amazon]
        Providers[celery] Providers[google] Providers[standard]"}]'
      pull-request-labels: '[''area:dev-tools'', ''backport-to-v3-3-test'']'
      python-versions-list-as-string: '3.10'
      python-versions: '[''3.10'']'
      run-agent-framework-tests: 'true'
      run-airflow-ctl-tests: 'true'
      run-airflow-ctl-integration-tests: 'true'
      run-amazon-tests: 'true'
      run-api-codegen: 'true'
      run-api-tests: 'true'
      run-coverage: 'false'
      run-go-sdk-tests: 'true'
      run-java-sdk-tests: 'true'
      run-ts-sdk-docs: 'true'
      run-helm-tests: 'true'
      run-kubernetes-tests: 'true'
      run-mypy-providers: 'true'
      run-remote-logging-elasticsearch-e2e-tests: 'true'
      run-remote-logging-opensearch-e2e-tests: 'true'
      run-remote-logging-s3-e2e-tests: 'true'
      run-event-driven-e2e-tests: 'true'
      run-java-sdk-e2e-tests: 'true'
      run-go-sdk-e2e-tests: 'true'
      run-openlineage-e2e-tests: 'true'
      run-openlineage-e2e-compat-tests: 'true'
      run-ts-sdk-e2e-tests: 'true'
      run-system-tests: 'true'
      run-task-sdk-tests: 'true'
      run-task-sdk-integration-tests: 'true'
      run-breeze-integration-tests: 'true'
      run-scripts-tests: 'true'
      runner-type: '["ubuntu-22.04"]'
      run-ui-tests: 'true'
      run-ui-e2e-tests: 'false'
      run-unit-tests: 'true'
      run-www-tests: ''
      selected-providers-list-as-string: ''
      shared-distributions-as-json: '["state", "observability", "configuration", "module_loading", "listeners", "dagnode", "timezones", "plugins_manager", "secrets_masker",
        "template_rendering",  "serialization", "logging", "secrets_backend", "providers_discovery"]'
      skip-prek-hooks: identity,update-uv-lock
      skip-providers-tests: 'false'
      source-head-repo: zozo123/airflow
      source-head-ref: ci/ci-image-data-root-snapshot
      sqlite-exclude: '[]'
      testable-core-integrations: '[''kerberos'', ''otel'', ''redis'']'
      testable-providers-integrations: '[''celery'', ''cassandra'', ''drill'', ''elasticsearch'', ''opensearch'', ''tinkerpop'', ''kafka'', ''mongo'', ''pinot'',
        ''qdrant'', ''redis'', ''trino'', ''ydb'']'
      use-uv: 'true'
      upgrade-to-newer-dependencies: 'false'
      is-uv-lock-update: 'false'
    steps:
    - name: Frozen upstream test matrix
      run: echo "Frozen from apache/airflow run 37236836509; variant baseline"
  print-platform:
    name: 'Platform: AMD'
    needs:
    - build-info
    runs-on:
    - ubuntu-slim
    steps:
    - name: Print architecture
      run: 'echo ''## Architecture: AMD'' >> $GITHUB_STEP_SUMMARY'
  basic-tests:
    name: Basic tests
    needs:
    - build-info
    uses: ./.github/workflows/basic-tests.yml
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      run-ui-tests: ${{needs.build-info.outputs.run-ui-tests}}
      run-www-tests: ${{needs.build-info.outputs.run-www-tests}}
      run-api-codegen: ${{needs.build-info.outputs.run-api-codegen}}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      basic-checks-only: ${{ needs.build-info.outputs.basic-checks-only }}
      skip-prek-hooks: ${{ needs.build-info.outputs.skip-prek-hooks }}
      canary-run: ${{needs.build-info.outputs.canary-run}}
      run-breeze-integration-tests: ${{needs.build-info.outputs.run-breeze-integration-tests}}
      run-scripts-tests: ${{needs.build-info.outputs.run-scripts-tests}}
      latest-versions-only: ${{needs.build-info.outputs.latest-versions-only}}
      use-uv: ${{needs.build-info.outputs.use-uv}}
      platform: ${{ needs.build-info.outputs.platform }}
      shared-distributions-as-json: ${{needs.build-info.outputs.shared-distributions-as-json}}
  build-ci-images:
    name: Build CI images
    needs:
    - build-info
    uses: ./.github/workflows/ci-image-build.yml
    permissions:
      contents: read
      packages: write
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      push-image: 'false'
      upload-image-artifact: 'true'
      upload-mount-cache-artifact: ${{ github.event.inputs.cache_mode == 'warm' && 'true' || 'false' }}
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      branch: ${{ needs.build-info.outputs.default-branch }}
      constraints-branch: ${{ needs.build-info.outputs.default-constraints-branch }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      upgrade-to-newer-dependencies: ${{ needs.build-info.outputs.upgrade-to-newer-dependencies }}
      docker-cache: ${{ github.event.inputs.cache_mode == 'cold' && 'disabled' || 'registry' }}
      disable-airflow-repo-cache: 'true'
      seed-cache-from-stashed-image: ${{ github.event.inputs.cache_mode == 'warm' && 'true' || 'false' }}
    if: needs.build-info.outputs.ci-image-build == 'true'
  additional-ci-image-checks:
    name: Additional CI image checks
    needs:
    - build-info
    - build-ci-images
    uses: ./.github/workflows/additional-ci-image-checks.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      branch: ${{ needs.build-info.outputs.default-branch }}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      upgrade-to-newer-dependencies: ${{ needs.build-info.outputs.upgrade-to-newer-dependencies }}
      skip-prek-hooks: ${{ needs.build-info.outputs.skip-prek-hooks }}
      latest-versions-only: ${{ needs.build-info.outputs.latest-versions-only }}
      debug-resources: ${{ needs.build-info.outputs.debug-resources }}
  generate-constraints:
    name: Generate constraints
    needs:
    - build-info
    - build-ci-images
    uses: ./.github/workflows/generate-constraints.yml
    if: needs.build-info.outputs.ci-image-build == 'true'
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      python-versions-list-as-string: ${{ needs.build-info.outputs.python-versions-list-as-string }}
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      generate-pypi-constraints: 'true'
      generate-no-providers-constraints: ${{ needs.build-info.outputs.canary-run }}
      debug-resources: ${{ needs.build-info.outputs.debug-resources }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  ci-image-checks:
    name: CI image checks
    needs:
    - build-info
    - build-ci-images
    uses: ./.github/workflows/ci-image-checks.yml
    permissions:
      id-token: write
      contents: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      python-versions-list-as-string: ${{ needs.build-info.outputs.python-versions-list-as-string }}
      branch: ${{ needs.build-info.outputs.default-branch }}
      canary-run: ${{ needs.build-info.outputs.canary-run }}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      docs-list-as-string: ${{ needs.build-info.outputs.docs-list-as-string }}
      latest-versions-only: ${{ needs.build-info.outputs.latest-versions-only }}
      basic-checks-only: ${{ needs.build-info.outputs.basic-checks-only }}
      upgrade-to-newer-dependencies: ${{ needs.build-info.outputs.upgrade-to-newer-dependencies }}
      skip-prek-hooks: ${{ needs.build-info.outputs.skip-prek-hooks }}
      ci-image-build: ${{ needs.build-info.outputs.ci-image-build }}
      include-success-outputs: ${{ needs.build-info.outputs.include-success-outputs }}
      debug-resources: ${{ needs.build-info.outputs.debug-resources }}
      docs-build: ${{ needs.build-info.outputs.docs-build }}
      run-api-codegen: ${{ needs.build-info.outputs.run-api-codegen }}
      default-postgres-version: ${{ needs.build-info.outputs.default-postgres-version }}
      run-coverage: ${{ needs.build-info.outputs.run-coverage }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      source-head-repo: ${{ needs.build-info.outputs.source-head-repo }}
      source-head-ref: ${{ needs.build-info.outputs.source-head-ref }}
    secrets:
      DOCS_AWS_ACCESS_KEY_ID: ${{ secrets.DOCS_AWS_ACCESS_KEY_ID }}
      DOCS_AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  mypy-providers:
    timeout-minutes: 45
    name: MyPy providers checks
    needs:
    - build-info
    - build-ci-images
    runs-on: ${{ fromJSON(needs.build-info.outputs.runner-type) }}
    if: needs.build-info.outputs.run-mypy-providers == 'true'
    env:
      PYTHON_MAJOR_MINOR_VERSION: ${{ needs.build-info.outputs.default-python-version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Cleanup repo
      shell: bash
      run: sudo rm -rf ${GITHUB_WORKSPACE}/*
    - name: Checkout ${{ github.ref }} ( ${{ github.sha }} )
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: 'Prepare breeze & CI image: ${{ needs.build-info.outputs.default-python-version }}'
      uses: ./.github/actions/prepare_breeze_and_image
      with:
        platform: ${{ needs.build-info.outputs.platform }}
        python: ${{ needs.build-info.outputs.default-python-version }}
        use-uv: ${{ needs.build-info.outputs.use-uv }}
        make-mnt-writeable-and-cleanup: true
      id: breeze
    - name: Install prek
      uses: ./.github/actions/install-prek
      id: prek
      with:
        platform: ${{ needs.build-info.outputs.platform }}
        save-cache: false
    - name: MyPy checks for providers
      run: prek --color always --verbose --stage manual mypy-providers --all-files
      env:
        VERBOSE: 'false'
        COLUMNS: '202'
        SKIP_GROUP_OUTPUT: 'true'
        DEFAULT_BRANCH: ${{ needs.build-info.outputs.default-branch }}
        RUFF_FORMAT: github
        INCLUDE_MYPY_VOLUME: 'false'
  migration-round-trip:
    timeout-minutes: 20
    name: Migration round-trip check
    needs:
    - build-info
    - build-ci-images
    runs-on: ${{ fromJSON(needs.build-info.outputs.runner-type) }}
    if: needs.build-info.outputs.has-migrations == 'true'
    env:
      PYTHON_MAJOR_MINOR_VERSION: ${{ needs.build-info.outputs.default-python-version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Cleanup repo
      shell: bash
      run: sudo rm -rf ${GITHUB_WORKSPACE}/*
    - name: Checkout ${{ github.ref }} ( ${{ github.sha }} )
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: 'Prepare breeze & CI image: ${{ needs.build-info.outputs.default-python-version }}'
      uses: ./.github/actions/prepare_breeze_and_image
      with:
        platform: ${{ needs.build-info.outputs.platform }}
        python: ${{ needs.build-info.outputs.default-python-version }}
        use-uv: ${{ needs.build-info.outputs.use-uv }}
        make-mnt-writeable-and-cleanup: true
      id: breeze
    - name: Install prek
      uses: ./.github/actions/install-prek
      id: prek
      with:
        platform: ${{ needs.build-info.outputs.platform }}
        save-cache: false
    - name: Migration round-trip check
      run: prek --color always --verbose --stage manual migration-round-trip --all-files
      env:
        VERBOSE: 'false'
        COLUMNS: '202'
        SKIP_GROUP_OUTPUT: 'true'
        DEFAULT_BRANCH: ${{ needs.build-info.outputs.default-branch }}
  providers:
    name: Provider distributions tests
    uses: ./.github/workflows/test-providers.yml
    needs:
    - build-info
    - build-ci-images
    permissions:
      contents: read
      packages: read
    if: 'needs.build-info.outputs.skip-providers-tests != ''true'' && needs.build-info.outputs.latest-versions-only != ''true'' && needs.build-info.outputs.run-unit-tests
      == ''true''

      '
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      canary-run: ${{ needs.build-info.outputs.canary-run }}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      upgrade-to-newer-dependencies: ${{ needs.build-info.outputs.upgrade-to-newer-dependencies }}
      selected-providers-list-as-string: ${{ needs.build-info.outputs.selected-providers-list-as-string }}
      providers-compatibility-tests-matrix: '${{ needs.build-info.outputs.providers-compatibility-tests-matrix }}

        '
      skip-providers-tests: ${{ needs.build-info.outputs.skip-providers-tests }}
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      providers-test-types-list-as-strings-in-json: '${{ needs.build-info.outputs.providers-test-types-list-as-strings-in-json }}

        '
      use-uv: ${{ needs.build-info.outputs.use-uv }}
  tests-helm:
    name: Helm tests
    uses: ./.github/workflows/helm-tests.yml
    needs:
    - build-info
    - build-ci-images
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      helm-test-packages: ${{ needs.build-info.outputs.helm-test-packages }}
      helm-test-kubernetes-versions: ${{ needs.build-info.outputs.helm-test-kubernetes-versions }}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
    if: 'needs.build-info.outputs.run-helm-tests == ''true'' && needs.build-info.outputs.default-branch == ''main'' && needs.build-info.outputs.latest-versions-only
      != ''true''

      '
  tests-kustomize-overlays:
    name: Kustomize overlays smoke tests
    uses: ./.github/workflows/kustomize-overlays-tests.yml
    needs:
    - build-info
    - build-prod-images
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      overlays: ${{ needs.build-info.outputs.kustomize-overlay-names }}
    if: 'needs.build-info.outputs.run-kustomize-overlays-tests == ''true'' && needs.build-info.outputs.default-branch == ''main'' && needs.build-info.outputs.latest-versions-only
      != ''true'' && needs.build-info.outputs.kustomize-overlay-names != ''[]'' && needs.build-info.outputs.platform == ''linux/amd64''

      '
  tests-postgres-core:
    name: 'Postgres tests: core'
    uses: ./.github/workflows/run-unit-tests.yml
    needs:
    - build-info
    - build-ci-images
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      backend: postgres
      test-name: Postgres
      test-scope: DB
      test-group: core
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      backend-versions: ${{ needs.build-info.outputs.postgres-versions }}
      excluded-providers-as-string: ${{ needs.build-info.outputs.excluded-providers-as-string }}
      excludes: ${{ needs.build-info.outputs.postgres-exclude }}
      test-types-as-strings-in-json: '${{ needs.build-info.outputs.core-test-types-list-as-strings-in-json }}

        '
      include-success-outputs: ${{ needs.build-info.outputs.include-success-outputs }}
      run-migration-tests: 'true'
      run-coverage: ${{ needs.build-info.outputs.run-coverage }}
      debug-resources: ${{ needs.build-info.outputs.debug-resources }}
      skip-providers-tests: ${{ needs.build-info.outputs.skip-providers-tests }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      default-branch: ${{ needs.build-info.outputs.default-branch }}
    if: needs.build-info.outputs.run-unit-tests == 'true'
  tests-postgres-providers:
    name: 'Postgres tests: providers'
    uses: ./.github/workflows/run-unit-tests.yml
    needs:
    - build-info
    - build-ci-images
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      backend: postgres
      test-name: Postgres
      test-scope: DB
      test-group: providers
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      backend-versions: ${{ needs.build-info.outputs.postgres-versions }}
      excluded-providers-as-string: ${{ needs.build-info.outputs.excluded-providers-as-string }}
      excludes: ${{ needs.build-info.outputs.postgres-exclude }}
      test-types-as-strings-in-json: '${{ needs.build-info.outputs.providers-test-types-list-as-strings-in-json }}

        '
      include-success-outputs: ${{ needs.build-info.outputs.include-success-outputs }}
      run-migration-tests: 'true'
      run-coverage: ${{ needs.build-info.outputs.run-coverage }}
      debug-resources: ${{ needs.build-info.outputs.debug-resources }}
      skip-providers-tests: ${{ needs.build-info.outputs.skip-providers-tests }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      default-branch: ${{ needs.build-info.outputs.default-branch }}
    if: needs.build-info.outputs.run-unit-tests == 'true'
  tests-mysql-core:
    name: 'MySQL tests: core'
    uses: ./.github/workflows/run-unit-tests.yml
    needs:
    - build-info
    - build-ci-images
