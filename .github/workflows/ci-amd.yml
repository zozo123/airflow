        retention-days: 7
        if-no-files-found: error
        overwrite: 'true'
  tests-airflow-ctl:
    name: Airflow CTL tests
    uses: ./.github/workflows/airflow-distributions-tests.yml
    needs:
    - build-info
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      canary-run: ${{ needs.build-info.outputs.canary-run }}
      distribution-name: airflow-ctl
      distribution-cmd-format: prepare-airflow-ctl-distributions
      test-type: airflow-ctl-tests
      use-local-venv: 'true'
      test-timeout: 20
    if: needs.build-info.outputs.run-airflow-ctl-tests == 'true'
  tests-agent-frameworks:
    name: Agent framework tests
    uses: ./.github/workflows/agent-framework-tests.yml
    needs:
    - build-info
    - build-ci-images
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      default-python-version: ${{ needs.build-info.outputs.default-python-version }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      canary-run: ${{ needs.build-info.outputs.canary-run }}
    if: needs.build-info.outputs.run-agent-framework-tests == 'true'
  summarize-warnings:
    timeout-minutes: 15
    name: Summarize warnings
    needs:
    - build-info
    - tests-mysql-core
    - tests-mysql-providers
    - tests-non-db-core
    - tests-non-db-providers
    - tests-postgres-core
    - tests-postgres-providers
    - tests-sqlite-core
    - tests-sqlite-providers
    - tests-task-sdk
    - tests-airflow-ctl
    - tests-special
    - tests-with-lowest-direct-resolution-core
    - tests-with-lowest-direct-resolution-providers
    runs-on: ${{ fromJSON(needs.build-info.outputs.runner-type) }}
    if: needs.build-info.outputs.run-unit-tests == 'true'
    steps:
    - name: Cleanup repo
      shell: bash
      run: sudo rm -rf ${GITHUB_WORKSPACE}/*
    - name: Checkout ${{ github.ref }} ( ${{ github.sha }} )
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Free up disk space
      shell: bash
      run: ./scripts/tools/free_up_disk_space.sh
    - name: Download all test warning artifacts from the current build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: ./artifacts
        pattern: test-warnings-*
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ needs.build-info.outputs.default-python-version }}
    - name: Summarize all warnings
      run: "./scripts/ci/testing/summarize_captured_warnings.py ./artifacts \\\n  --pattern \"**/warnings-*.txt\" \\\n  --output ./files\n"
    - name: Upload artifact for summarized warnings
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-summarized-warnings
        path: ./files/warn-summary-*.txt
        retention-days: 7
        if-no-files-found: ignore
        overwrite: true
'on':
  workflow_dispatch:
    inputs:
      cache_mode:
        type: choice
        options:
        - cold
        - warm
        default: cold
        required: true
      probe:
        type: choice
        options:
        - none
        - source
        - lock
        default: none
        required: true
      sample:
        type: string
        default: pilot
        required: true
