name: Ascii Box PR validation

on:
  push:
    branches:
      - add-ascii-box-sandbox-backend

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Restore Ascii Box provider metadata and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider = Path("providers/common/ai/provider.yaml")
          text = provider.read_text()
          marker = "  - integration-name: Docker Sandboxes\n    external-doc-url: https://docs.docker.com/ai/sandboxes/\n    tags: [software]\n"
          addition = marker + "  - integration-name: Ascii Box\n    external-doc-url: https://docs.ascii.dev/box/quickstart\n    tags: [service]\n"
          if "integration-name: Ascii Box" not in text:
              if marker not in text:
                  raise SystemExit("Docker Sandboxes integration marker not found")
              provider.write_text(text.replace(marker, addition, 1))

          docs = Path("providers/common/ai/docs/toolsets.rst")
          text = docs.read_text()
          old = """   Treat it as the backend you develop and test a sandboxed agent against, then\n   run something else in production. A hosted backend plugs in through\n   :class:`~airflow.providers.common.ai.sandbox.SandboxBackend`, but none ships\n   with the provider yet.\n"""
          new = """   Treat it as the backend you develop and test a sandboxed agent against, then\n   run something else in production. Hosted backends such as\n   :class:`~airflow.providers.common.ai.sandbox.AsciiBoxSandboxBackend` plug in\n   through :class:`~airflow.providers.common.ai.sandbox.SandboxBackend`.\n"""
          if "Ascii Box backend\n^^^^^^^^^^^^^^^^^" not in text:
              if old not in text:
                  raise SystemExit("Hosted backend documentation marker not found")
              text = text.replace(old, new, 1)
              marker = "Bringing your own backend\n^^^^^^^^^^^^^^^^^^^^^^^^^\n"
              section = """Ascii Box backend\n^^^^^^^^^^^^^^^^^\n\n:class:`~airflow.providers.common.ai.sandbox.AsciiBoxSandboxBackend` runs each\nsandbox in an `Ascii Box <https://docs.ascii.dev/box/quickstart>`__ cloud\ncomputer. Unlike ``sbx``, the worker talks to a hosted API and needs neither a\nlocal daemon nor host virtualization, so it can run from a containerized worker.\n\nRequires the ``sandbox-ascii-box`` extra::\n\n    pip install \"apache-airflow-providers-common-ai[sandbox-ascii-box]\"\n\nBox creation is an API call, so the account behind the key must be enabled for\nAscii Box. If creation is rejected, the backend includes Box's error detail in\nthe task failure instead of returning only an HTTP status.\n\n.. code-block:: python\n\n    from airflow.providers.common.ai.sandbox import AsciiBoxSandboxBackend, SandboxSpec\n    from airflow.providers.common.ai.toolsets import SandboxToolset\n\n    SandboxToolset(\n        AsciiBoxSandboxBackend(box_conn_id=\"ascii_box_default\"),\n        spec=SandboxSpec(block_network=False),\n    )\n\nCredentials come from a generic Airflow connection, resolved lazily on first\nuse, so the API key can live in the configured secrets backend rather than the\nDag or worker environment:\n\n- ``password``: the Box API key. Required.\n- ``host``: the API base URL. Optional; defaults to ``https://ascii.dev/api/box/v1``.\n- Extra: optional ``timeout`` (request timeout in seconds) and ``no_env``\n  (withhold account secrets; default ``true``).\n\nConstructor parameters:\n\n- ``box_conn_id``: Connection ID. Default ``\"ascii_box_default\"``. ``None`` lets\n  the backend resolve ``BOX_API_KEY`` (and optional ``BOX_BASE_URL``) from the\n  environment.\n- ``machine_type``: Box machine size: ``small``, ``default``, or ``large``.\n  Default ``\"default\"``.\n- ``ttl_seconds``: Server-side auto-stop TTL in seconds, after which the Box is\n  archived even if the worker never got to destroy it. Default ``3600``.\n- ``ready_timeout``: Seconds to wait for a newly created Box to become ready.\n  Default ``300``.\n- ``no_env``: Create a no-env Box that receives none of the account's stored\n  secrets. ``None`` (default) reads the connection extra and otherwise defaults\n  to ``True``.\n\nAscii Box cannot deny outbound network access or scope it to named hosts.\n``create`` therefore refuses ``block_network=True`` and ``allow_egress_to``, so a\nDag author never believes a restriction is in force when it is not. Pass\n``SandboxSpec(block_network=False)`` when open egress is acceptable.\n\n``SandboxSpec.env`` is passed at creation. File reads and writes use Box's\nnative APIs for paths under ``/home/user`` or ``/tmp``. Directory listings and\nparent-directory creation use common Unix tools in the Box image. Command\noutput is bounded before it reaches the worker. Commands are limited to 600\nseconds by the API; a timeout destroys the Box before reporting failure, while\n``ttl_seconds`` remains the orphan-cleanup backstop.\n\n"""
              if marker not in text:
                  raise SystemExit("Bring-your-own-backend marker not found")
              docs.write_text(text.replace(marker, section + marker, 1))
          PY

      - name: Regenerate provider files with Airflow tooling
        shell: bash
        env:
          DISTRIBUTIONS_LIST: common.ai
        run: |
          set -euo pipefail
          uv run --project dev/breeze breeze release-management prepare-provider-documentation --reapply-templates-only
          allowed='^(providers/common/ai/(provider.yaml|pyproject.toml|docs/(index.rst|toolsets.rst)|src/airflow/providers/common/ai/get_provider_info.py|src/airflow/providers/common/ai/sandbox/.*|tests/.*)|uv.lock|\.github/workflows/ascii-box-pr-validation.yml)$'
          while IFS= read -r file; do
            if ! [[ "$file" =~ $allowed ]]; then
              git restore -- "$file"
            fi
          done < <(git diff --name-only)

      - name: Format and lint Ascii backend
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py providers/common/ai/tests/system/common/ai/example_sandbox_toolset_ascii_box.py
          uv run ruff check --fix providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py providers/common/ai/tests/system/common/ai/example_sandbox_toolset_ascii_box.py

      - name: Verify lockfile
        shell: bash
        run: uv lock --check

      - name: Run focused Ascii Box unit tests
        shell: bash
        run: uv run --project providers/common/ai --extra sandbox-ascii-box pytest providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py -q

      - name: Show resulting diff
        shell: bash
        run: git diff --check && git status --short

      - name: Commit generated refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add providers/common/ai/provider.yaml providers/common/ai/docs/index.rst providers/common/ai/docs/toolsets.rst providers/common/ai/src/airflow/providers/common/ai/get_provider_info.py providers/common/ai/pyproject.toml providers/common/ai/src/airflow/providers/common/ai/sandbox providers/common/ai/tests uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Ascii Box provider integration [skip ci]"
            git push origin HEAD:add-ascii-box-sandbox-backend
          fi
