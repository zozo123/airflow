name: Ascii Box live E2E proof

on:
  push:
    branches:
      - ascii-box-e2e-proof-20260914
    paths:
      - .github/workflows/ascii-box-live-proof.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-22.04
    env:
      PR_HEAD: 878317910c7674d82437d686bedca355a87964b3
    steps:
      - name: Check out proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ascii-box-e2e-proof-20260914
          fetch-depth: 1

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Run focused Ascii Box unit tests with real optional SDK
        shell: bash
        run: |
          uv run --project providers/common/ai --extra sandbox-ascii-box \
            pytest providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py -q

      - name: Check changed Python formatting and lint
        shell: bash
        run: |
          files=(
            providers/common/ai/src/airflow/providers/common/ai/sandbox/ascii_box.py
            providers/common/ai/src/airflow/providers/common/ai/sandbox/__init__.py
            providers/common/ai/src/airflow/providers/common/ai/get_provider_info.py
            providers/common/ai/tests/unit/common/ai/sandbox/test_ascii_box.py
            providers/common/ai/tests/system/common/ai/example_sandbox_toolset_ascii_box.py
          )
          uv run --project providers/common/ai --extra sandbox-ascii-box ruff check "${files[@]}"
          uv run --project providers/common/ai --extra sandbox-ascii-box ruff format --check "${files[@]}"

      - name: Verify system test collects with real optional SDK
        shell: bash
        run: |
          uv run --project providers/common/ai --extra sandbox-ascii-box \
            pytest --system \
            providers/common/ai/tests/system/common/ai/example_sandbox_toolset_ascii_box.py \
            --collect-only -q

  live-e2e:
    needs: preflight
    runs-on: ubuntu-22.04
    env:
      BOX_API_KEY: ${{ secrets.BOX_API_KEY }}
      PR_HEAD: 878317910c7674d82437d686bedca355a87964b3
    steps:
      - name: Check out proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ascii-box-e2e-proof-20260914
          fetch-depth: 1

      - name: Require GitHub Actions secret
        shell: bash
        run: |
          if [ -z "${BOX_API_KEY:-}" ]; then
            echo "::error::BOX_API_KEY repository secret is not configured on zozo123/airflow"
            exit 2
          fi
          echo "BOX_API_KEY is present and remains masked by GitHub Actions."

      - name: Install uv and GIF dependency
        run: python -m pip install --disable-pip-version-check uv pillow

      - name: Verify direct Ascii Box lifecycle
        shell: bash
        run: |
          uv run --project providers/common/ai --extra sandbox-ascii-box python - <<'PY'
          from contextlib import suppress

          from airflow.providers.common.ai.sandbox import AsciiBoxSandboxBackend, SandboxSpec

          backend = AsciiBoxSandboxBackend(
              box_conn_id=None,
              ttl_seconds=900,
              ready_timeout=300,
          )
          sandbox = None
          try:
              sandbox = backend.create(
                  spec=SandboxSpec(
                      block_network=False,
                      env={"AIRFLOW_ASCII_E2E_ENV": "env-ok"},
                  )
              )

              result = backend.run_command(
                  sandbox,
                  'printf "command-ok|%s" "$AIRFLOW_ASCII_E2E_ENV"',
                  timeout=60,
                  max_output_bytes=4096,
              )
              assert result.exit_code == 0, result
              assert not result.timed_out, result
              assert result.stdout.strip() == "command-ok|env-ok", result.stdout

              path = "/tmp/airflow_ascii_e2e/state.txt"
              payload = b"boundary-ok\n"
              backend.write_file(sandbox, path, payload)
              assert backend.read_file(sandbox, path, max_bytes=1024) == payload

              entries = backend.list_directory(sandbox, "/tmp/airflow_ascii_e2e")
              assert ("state.txt", False) in entries, entries

              # destroy() guarantees that the delete request was accepted, not that
              # asynchronous remote teardown has already completed. Calling it twice
              # also verifies the backend's required idempotent teardown contract.
              backend.destroy(sandbox)
              backend.destroy(sandbox)
              sandbox = None
          finally:
              if sandbox is not None:
                  with suppress(Exception):
                      backend.destroy(sandbox)

          print("DIRECT_LIFECYCLE_PASS create ready env command write read list delete-accepted idempotent-delete")
          PY

      - name: Run real SandboxToolset system test against Ascii Box
        shell: bash
        run: |
          uv run --project providers/common/ai --extra sandbox-ascii-box \
            pytest --system \
            providers/common/ai/tests/system/common/ai/example_sandbox_toolset_ascii_box.py -q

      - name: Create sanitized proof GIF and manifest
        shell: bash
        run: |
          mkdir -p proof
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1000, 560
          try:
              title_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 40)
              body_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 30)
              small_font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 22)
          except OSError:
              title_font = body_font = small_font = ImageFont.load_default()

          frames = []
          pages = [
              ("Apache Airflow #71725", ["Ascii Box live E2E", "GitHub Actions • exact current PR code"]),
              ("Real sandbox lifecycle", ["create + ready ✓", "env + command ✓", "write + read + list ✓"]),
              ("Teardown verified", ["delete request accepted ✓", "idempotent second delete ✓", "server TTL backstop configured ✓"]),
              ("Agent boundary verified", ["SandboxToolset ✓", "AsciiBoxSandboxBackend ✓", "Real Ascii Box API ✓"]),
              ("LIVE E2E PASS", ["SDK-installed unit tests passed", "System test passed end-to-end", f"PR head: {os.environ['PR_HEAD'][:12]}"])
          ]
          for heading, lines in pages:
              img = Image.new("RGB", (W, H), "white")
              d = ImageDraw.Draw(img)
              d.rounded_rectangle((35, 35, W-35, H-35), radius=24, outline="black", width=3)
              d.text((75, 75), heading, font=title_font, fill="black")
              y = 155
              for line in lines:
                  d.text((85, y), line, font=body_font, fill="black")
                  y += 62
              d.text((75, H-75), "Generated only after both live E2E checks succeeded", font=small_font, fill="black")
              frames.append(img)

          frames[0].save(
              "proof/ascii-box-e2e.gif",
              save_all=True,
              append_images=frames[1:],
              duration=[1300, 1900, 1900, 1700, 1900],
              loop=0,
              optimize=True,
          )
          manifest = {
              "success": True,
              "pr": "apache/airflow#71725",
              "pr_head": os.environ["PR_HEAD"],
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "verified": [
                  "SDK-installed unit suite",
                  "style and format checks",
                  "system-test collection",
                  "direct create and readiness",
                  "explicit environment mapping",
                  "direct command execution",
                  "direct write_file",
                  "direct read_file",
                  "direct list_directory",
                  "delete request accepted",
                  "idempotent second delete",
                  "SandboxToolset agent system test",
              ],
              "secret_exposed": False,
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
          }
          Path("proof/ascii-box-e2e.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Commit GitHub-hosted proof
        shell: bash
        run: |
          git add proof/ascii-box-e2e.gif proof/ascii-box-e2e.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add verified Ascii Box live E2E proof"
          git push origin HEAD:ascii-box-e2e-proof-20260914
